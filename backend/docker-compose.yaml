services:
  frontend:
    build: {context: ../frontend, dockerfile: Dockerfile.frontend}
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:8000/api/v1
    ports: ["5173:5173"]
    depends_on: [web]
    restart: unless-stopped
  web:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    volumes: ["evidence:/app/private/evidence", "./artifacts:/app/artifacts:ro"]
    depends_on:
      redis: {condition: service_healthy}
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    command: ["python", "-m", "src.jobs.worker"]
    volumes: ["evidence:/app/private/evidence", "./artifacts:/app/artifacts:ro"]
    depends_on:
      redis: {condition: service_healthy}
    restart: unless-stopped
  dispatcher:
    build: .
    env_file: .env
    command: ["python", "-m", "src.jobs.dispatcher"]
    depends_on:
      redis: {condition: service_healthy}
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  evidence:
  redis-data:
